<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var choice = prompt("Welcome to area calculator.\n please enter your choice \n 1.Area of rectangtle. \n 2.Area of triangle. \n 3.Area of circle. \n 4.Area of parallelogram.")
        if (choice == "1"){
            var l = prompt("Enter length")
             var b = prompt("Enter breadth")
        
        var result = Number (l) * Number (b)
        alert("Area is " + result)
    }
     if (choice == "2") {
            var h = prompt("Enter height")
            var b = prompt("Enter base")

            var result = Number(h) * Number(b) / 2
            alert("Area is " + result)
        }
         if (choice == "3") {
                var r = prompt("Enter radius")
                var result = Number(r) * Number(r) * 3.142
                alert("Area is " + result)
            }
            if (choice == "4") {
                    var h = prompt("Enter height")
                    var cb = prompt("Enter corresponding base")

                    var result = Number(h) * Number(cb)
                    alert("Area is " + result)
                }
    </script>
</body>
</html>
