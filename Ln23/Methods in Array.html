<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   
    <p id=myjoin></p>
    <p id=firstpop></p>
    <p id=secondpop></p>
    <script>
var fruits=["apple","grapes","plum","peach"]
document.getElementById("myjoin").innerHTML=fruits.join("*")
    document.getElementById("firstpop").innerHTML = fruits;
fruits.pop()
    document.getElementById("secondpop").innerHTML = fruits;
    </script>
</body>
</html>
