<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="demo"></p>
    <script>
     function findmax(){
    var i 
    var max=0
    for(i=0;i<arguments.length;i++){
        if(arguments[i]>max){
            max=arguments[i]
        }
    }
    return max
        }
        document.getElementById("demo").innerHTML=findmax(4,5,7,3,8)
    </script>
</body>
</html>
