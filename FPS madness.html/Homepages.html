<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        .topnav {
            display: flex;
            justify-content: center;
            gap: 30px;
            background-color: #fffefe33;
            border-bottom: 1px solid #fffefe73;
            padding: 10px;
            position: relative;
        }

        .topnav a {
            color: #1135a29c;
            text-decoration: none;
            font-size: 17px;
            padding: 10px;
            position: relative;
            transition: color 0.3s ease;
        }

        .topnav a:hover {
           color: hsla(211, 74%, 47%, 0.485);
                 background-color: #a39e9eab;
        }

        .topnav a::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: 0;
            width: 0%;
            height: 3px;
            background-color: #0078d7;
            transition: width 0.3s ease;
        }

        .topnav.a:hover::after {
            width: 100%;
        }

        .topnav a.active::after {
            width: 100%;
        }

        topnav a.active {
            color: #fffefe67;
            font-weight: bold;
        }
        .footer{
            position:fixed;
            left:0;
            bottom:0;
            width: 100%;
            background-color:rgba(0, 0, 0, 0.366);
            color:white;
            text-align:center;
        }
        
        body {
background-color: #fffafa;
color: white;
font-family: Arial, sans-serif;
margin: 0;
padding: 20px;
}

h1 {
text-align: center;
margin-bottom: 30px;
}

.game-container {
display: grid;
grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
gap: 20px;
}

.game-card {
background-color: #000000;
border-radius: 12px;
overflow: hidden;
transition: transform 0.3s, box-shadow 0.3s;
}

.game-card img {
width: 1000px;
height: 500px;

}

a {
text-decoration: none;
color: white;
}
    </style>
</head>
