<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        .topnav {
            display: flex;
            justify-content: center;
            gap: 30px;
            background-color: #fffefe33;
            border-bottom: 1px solid #fffefe73;
            padding: 10px;
            position: relative;
        }

        .topnav a {
            color: #1135a29c;
            text-decoration: none;
            font-size: 17px;
            padding: 10px;
            position: relative;
            transition: color 0.3s ease;
        }

        .topnav a:hover {
           color: hsla(211, 74%, 47%, 0.485);
                 background-color: #a39e9eab;
        }

        .topnav a::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: 0;
            width: 0%;
            height: 3px;
            background-color: #0078d7;
            transition: width 0.3s ease;
        }

        .topnav.a:hover::after {
            width: 100%;
        }

        .topnav a.active::after {
            width: 100%;
        }

        topnav a.active {
            color: #fffefe67;
            font-weight: bold;
        }
        .footer{
            position:fixed;
            left:0;
            bottom:0;
            width: 100%;
            background-color:black;
            color:white;
            text-align:center;
        }
    </style>
</head>

<body>
    <div class="topnav">
        <a href="Homepages.html">Home</a>
        <a class="active" href="Games.html">Games</a>
        <a href="News and Announcements.html">News and Announcements</a>
        <a href="Community.html">Community</a>
       
    </div>
    <section>
        <img class="myslides" src="Attack of duty.png">
        <img class="myslides" src="Cyberpunk.png">
        <img class="myslides" src="fragen.png">
        <img class="myslides" src="Hazmob.png">
        <img class="myslides" src="Kour io.png">
    </section>    
    <script>
        var myindex=0;
        carousel()
        function carousel(){
            var i
            var x = document.getElementsByClassName("myslides")
            for (i=0;i<x.length;i++){
           x[i].style.display ="none";
 }
 myindex++;
 if(myindex>x.length){
    myindex=1
 }
 x[myindex-1].style.display="block"
setTimeout(carousel,3000)
        }
    </script>
    <div class="footer">
        <p>@copy all rights & reserved by FPS madness</p>
    </div>

</body>

</html>
