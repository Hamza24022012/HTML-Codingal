        body {

        .topnav {
            display: flex;
            justify-content: center;
            gap: 30px;
            background-color: #fffefe33;
            border-bottom: 1px solid #fffefe73;
            padding: 10px;
            position: relative;
        }

        .topnav a {
            color: #1135a29c;
            text-decoration: none;
            font-size: 17px;
            padding: 10px;
            position: relative;
            transition: color 0.3s ease;
        }

        .topnav a:hover {
          color: hsla(211, 74%, 47%, 0.485);
                 background-color: #a39e9eab;
        }

        .topnav a::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: 0;
            width: 0%;
            height: 3px;
            background-color: #0078d7;
            transition: width 0.3s ease;
        }

        .topnav.a:hover::after {
            width: 100%;
        }

        .topnav a.active::after {
            width: 100%;
        }

        topnav a.active {
            color: #fffefe67;
            font-weight: bold;
        }
        .footer{
            position:fixed;
            left:0;
            bottom:0;
            width: 100%;
            background-color:black;
            color:white;
            text-align:center;
        }

text-align: center;
margin-bottom: 30px;
