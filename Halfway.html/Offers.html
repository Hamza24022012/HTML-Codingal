<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        .topnav {
            display: flex;
            justify-content: center;
            gap: 30px;
            background-color: #fffefe33;
            border-bottom: 1px solid #fffefe73;
            padding: 10px;
            position: relative;
        }

        .topnav a {
            color: #1135a29c;
            text-decoration: none;
            font-size: 17px;
            padding: 10px;
            position: relative;
            transition: color 0.3s ease;
        }

        .topnav a:hover {
            color: hsla(211, 74%, 47%, 0.485);
            background-color: #a39e9eab;
        }

        .topnav a::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: 0;
            width: 0%;
            height: 3px;
            background-color: #0078d7;
            transition: width 0.3s ease;
        }

        .topnav.a:hover::after {
            width: 100%;
        }

        .topnav a.active::after {
            width: 100%;
        }

        topnav a.active {
            color: #fffefe67;
            font-weight: bold;
        }
         * {margin: 0;
        padding: 0;
    box-sizing: border-box;
font-family: Arial, Helvetica, sans-serif;
}
.image-section {
height: 400px;
background-size: cover;
background-position: center;
position: relative;
}
.overlay {
    background-color: rgba(red, green, blue, alpha),0,0.4;
    height: 100%;
    display: flex;
    justify-content:center ;
    align-items: center;
}
.overlay h1 {
    color: white;
    font-size: 28px;
    letter-spacing: 2px;
    text-align: center;
}
.content-section {
    background-color: #1a1a1a;
    color: white;
    text-align: center;
    padding: 20px,40px;
}
.content-section h2 {
font-size: 24px;
margin-bottom: 10px;
font-weight: bold;
}
.content-section p {
   max-width: 700px;
   margin: 0 auto;
   line-height: 1.6;
font-size: 16px;
}
#section1 {
    background-image: url('https://upload.wikimedia.org/wikipedia/commons/9/91/Pizza-3007395.jpg');
}
html {scroll-behavior: smooth;}
</style>
</head>

    </style>
</head>
